<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0e1117"/>

  <!-- safe area for maskable: keep art inside the centre 80% -->
  <g stroke="url(#g)" stroke-width="14" fill="none" stroke-linecap="round">
    <!-- top couple bond -->
    <path d="M196 150 H316"/>
    <!-- drop from the bond -->
    <path d="M256 150 V208"/>
    <!-- spread to three children -->
    <path d="M146 208 H366"/>
    <path d="M146 208 V250"/>
    <path d="M256 208 V250"/>
    <path d="M366 208 V250"/>
    <!-- second generation bond -->
    <path d="M146 330 V362 H256" stroke-dasharray="10 14"/>
    <path d="M366 330 V362 H256" stroke-dasharray="10 14"/>
  </g>

  <!-- generation one -->
  <circle cx="196" cy="150" r="34" fill="#0e1117" stroke="#5eead4" stroke-width="14"/>
  <circle cx="316" cy="150" r="34" fill="#0e1117" stroke="#f9a8d4" stroke-width="14"/>

  <!-- generation two -->
  <circle cx="146" cy="290" r="40" fill="#0e1117" stroke="#7dd3fc" stroke-width="14"/>
  <circle cx="256" cy="290" r="40" fill="#0e1117" stroke="#818cf8" stroke-width="14"/>
  <circle cx="366" cy="290" r="40" fill="#0e1117" stroke="#86efac" stroke-width="14"/>

  <!-- generation three -->
  <circle cx="256" cy="400" r="30" fill="#0e1117" stroke="#c4b5fd" stroke-width="13"/>
</svg>
